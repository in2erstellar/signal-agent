# Production compose. Build the image once; do not mount the source tree.
# Required variables are listed in README.md. Compose refuses to start when
# one of the ${VAR:?} entries is empty.

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  HELIUS_API_KEY: ${HELIUS_API_KEY:?set HELIUS_API_KEY}
  HELIUS_WEBHOOK_SECRET: ${HELIUS_WEBHOOK_SECRET:?set HELIUS_WEBHOOK_SECRET}
  HELIUS_WEBHOOK_ID: ${HELIUS_WEBHOOK_ID:-}
  HELIUS_API_BASE_URL: ${HELIUS_API_BASE_URL:-https://api.helius.xyz}
  HELIUS_RPC_URL: ${HELIUS_RPC_URL:-https://mainnet.helius-rpc.com}
  RAYDIUM_API_BASE_URL: ${RAYDIUM_API_BASE_URL:-https://api-v3.raydium.io}
  PUMPPORTAL_API_KEY: ${PUMPPORTAL_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
  TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
  PUBLIC_API_KEY: ${PUBLIC_API_KEY:?set PUBLIC_API_KEY}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
  ENVIRONMENT: prod
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg16-oss
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: "1.0"

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: "0.5"

  api:
    image: signalforge:prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    cpus: "1.0"

  worker:
    image: signalforge:prod
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.runner"]
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: "1.0"

volumes:
  pgdata:
  redisdata:
