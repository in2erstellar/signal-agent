services:
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb:2.30.1-pg16-oss
    environment:
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge
      POSTGRES_DB: signalforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge -d signalforge"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    restart: unless-stopped
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://signalforge:signalforge@postgres:5432/signalforge
      REDIS_URL: redis://redis:6379/0
      HELIUS_API_KEY: ${HELIUS_API_KEY:-replace-me}
      HELIUS_WEBHOOK_SECRET: ${HELIUS_WEBHOOK_SECRET:-replace-me}
      HELIUS_WEBHOOK_ID: ${HELIUS_WEBHOOK_ID:-}
      HELIUS_API_BASE_URL: https://api.helius.xyz
      HELIUS_RPC_URL: https://mainnet.helius-rpc.com
      RAYDIUM_API_BASE_URL: https://api-v3.raydium.io
      PUMPPORTAL_API_KEY: ${PUMPPORTAL_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace-me}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-replace-me}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-replace-me}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-replace-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      AI_REVIEW_MODEL: ${AI_REVIEW_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    restart: unless-stopped
    build: .
    command: ["python", "-m", "app.workers.runner"]
    environment:
      DATABASE_URL: postgresql+asyncpg://signalforge:signalforge@postgres:5432/signalforge
      REDIS_URL: redis://redis:6379/0
      HELIUS_API_KEY: ${HELIUS_API_KEY:-replace-me}
      HELIUS_WEBHOOK_SECRET: ${HELIUS_WEBHOOK_SECRET:-replace-me}
      HELIUS_WEBHOOK_ID: ${HELIUS_WEBHOOK_ID:-}
      HELIUS_API_BASE_URL: https://api.helius.xyz
      HELIUS_RPC_URL: https://mainnet.helius-rpc.com
      RAYDIUM_API_BASE_URL: https://api-v3.raydium.io
      PUMPPORTAL_API_KEY: ${PUMPPORTAL_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace-me}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-replace-me}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-replace-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      AI_REVIEW_MODEL: ${AI_REVIEW_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
