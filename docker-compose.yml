services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg16-oss
    environment:
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge
      POSTGRES_DB: signalforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge -d signalforge"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  signalforge:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://signalforge:signalforge@postgres:5432/signalforge
      REDIS_URL: redis://redis:6379/0
      HELIUS_API_KEY: replace-me
      HELIUS_WEBHOOK_SECRET: replace-me
      HELIUS_API_BASE_URL: https://api.helius.xyz
      HELIUS_RPC_URL: https://mainnet.helius-rpc.com
      TELEGRAM_BOT_TOKEN: replace-me
      ANTHROPIC_API_KEY: replace-me
      TWITTER_BEARER_TOKEN: replace-me
      ENVIRONMENT: dev
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
