[project]
name = "signalforge"
version = "0.1.0"
description = "Monitoring and risk analysis for Solana memecoins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "prometheus-client==0.23.1",
    "pydantic-settings==2.15.0",
    "python-telegram-bot==22.5",
    "redis==8.1.0",
    "sqlalchemy==2.0.54",
    "structlog==26.1.0",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.13.2",
    "testcontainers==4.13.3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
packages = ["app.services", "app.adapters"]
strict = true
