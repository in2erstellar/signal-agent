[project]
name = "signalforge"
version = "0.1.0"
description = "Monitoring and risk analysis for Solana memecoins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
    "sqlalchemy==2.0.54",
    "structlog==26.1.0",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "testcontainers==4.13.3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
